<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1114"><meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<title>रायडर हिशोब</title>
<style>
:root{--bg:#0f1114;--card:#181b21;--card2:#21252d;--line:#2b303a;--tx:#f5f6f8;--mut:#9ba3b3;--ac:#2fd18a;--red:#ff5d6c;--blue:#4cb8ff;--r:22px;--pc:#ff7a1a;--g:linear-gradient(135deg,#ff8f26,#ff5a1f);--hg:linear-gradient(135deg,#1fbf7a,#0c7f56);--glow:#ff7a1a44;--sh:0 10px 30px #0007}
html[data-th=light]{--bg:#f6f4ef;--card:#fff;--card2:#f1eee7;--line:#e7e2d8;--tx:#1d1b18;--mut:#6f6a61;--ac:#0f9a62;--red:#e0414d;--sh:0 8px 24px #3a2a1214}
html[data-ac=green]{--pc:#16a34a;--g:linear-gradient(135deg,#22c55e,#15803d);--hg:linear-gradient(135deg,#15803d,#0b5a2b);--glow:#16a34a44}
html[data-ac=blue]{--pc:#2563eb;--g:linear-gradient(135deg,#3b82f6,#1d4ed8);--hg:linear-gradient(135deg,#1d4ed8,#1e3a8a);--glow:#2563eb44}
html[data-ac=purple]{--pc:var(--pc);--g:linear-gradient(135deg,#6d5dfc,#b44bff 60%,#ff5fa2);--hg:linear-gradient(135deg,#6d5dfc,#b44bff 60%,#ff5fa2);--glow:var(--glow)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;padding-bottom:104px}
header{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;max-width:560px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:14px;background:var(--g);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 18px var(--glow);flex:none}
header h1{margin:0;font-size:19px;flex:1;line-height:1.1}header h1 span{color:var(--ac)}header h1 small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:4px}
.gear{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;width:42px;height:42px;font-size:18px;box-shadow:var(--sh)}
main{padding:0 14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{margin:0 0 6px;font-size:19px}.card h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:700}
.hero{background:var(--hg);border:0;color:#fff;position:relative;overflow:hidden}.hero h3,.hero .mut,.hero .grid3 span{color:#ffffffc8}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff1c}.hero>*{position:relative;z-index:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.big{font-size:44px;font-weight:800;letter-spacing:.5px;color:var(--ac);font-variant-numeric:tabular-nums;margin:2px 0 10px}.hero .big{color:#fff}
.ring{width:76px;height:76px;border-radius:50%;background:conic-gradient(#fff calc(var(--p,0)*1%),#ffffff33 0);display:grid;place-items:center;flex:none}.ring b{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px}.grid3>div{background:#ffffff1f;border-radius:14px;padding:9px 4px}
.grid3 b{display:block;font-size:19px}.grid3 span{font-size:11.5px;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;background:var(--card2);border:1.5px solid var(--line);color:var(--tx);border-radius:14px;padding:13px 12px;font-size:17px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--pc);box-shadow:0 0 0 4px var(--glow)}
input[type=file]{padding:10px;font-size:14px}
.chk{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:15px}.chk input{width:22px;height:22px;accent-color:var(--pc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;background:var(--g);color:#fff;margin-top:14px;box-shadow:0 8px 20px var(--glow)}
.btn.big{padding:18px;font-size:19px;font-variant-numeric:normal;margin:14px 0 0;letter-spacing:0;color:#fff}.btn.red{background:linear-gradient(135deg,#ff5d73,#ff8a5c);box-shadow:0 8px 20px #ff5d7344}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line);box-shadow:none}.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin:12px 0;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;border-radius:12px;font-size:14px;font-weight:700}.seg button.on{background:var(--g);color:#fff}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:5;box-shadow:var(--sh)}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:10.5px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:20px;font-weight:700}
nav button i{font-style:normal;font-size:21px}nav button.on{background:var(--g);color:#fff}
.chip{display:inline-block;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;margin:0 6px 6px 0;font-weight:600}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item .m{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .s{font-size:12px;color:var(--mut)}.item .v{font-weight:800;color:var(--ac);white-space:nowrap}
.x{background:none;border:0;color:var(--mut);font-size:19px;padding:4px 7px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px}.pill.sw{color:#ff9a3c;border-color:#ff9a3c66}.pill.zo{color:#ff6b7f;border-color:#ff6b7f66}
.mut{color:var(--mut);font-size:13px}
.out{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out div{background:var(--card2);border-radius:16px;padding:12px}.out b{display:block;font-size:20px}.out span{font-size:12px;color:var(--mut)}
.out .w{grid-column:1/-1;background:#2ee6a61c;border:1px solid #2ee6a655}.out .w b{color:var(--ac);font-size:26px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}.bar .n{width:42%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .b{flex:1;height:10px;background:var(--card2);border-radius:9px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--g);border-radius:9px}.bar .c{width:78px;text-align:right;font-size:12px;color:var(--mut)}
.hours{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}.hours div{flex:1;background:var(--g);border-radius:4px 4px 0 0;min-height:2px}
.hl{display:flex;gap:3px;font-size:9px;color:var(--mut)}.hl span{flex:1;text-align:center}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--card2);border:1px solid var(--line)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:26px 26px 0 0;padding:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;border:1px solid var(--line)}#modal img{width:100%;border-radius:14px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:30;display:none;max-width:90%}
svg.map{width:100%;height:170px;background:var(--card2);border-radius:16px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}.sum b{text-align:right}

.tog{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:var(--card2);border:1px solid var(--line);margin:12px 0;cursor:pointer;box-shadow:var(--sh)}
.tog.on{background:linear-gradient(135deg,#12b886,#2ee6a6);color:#06281c;border-color:transparent}
.tog b{display:block;font-size:21px}.tog span{font-size:12.5px;opacity:.8}
.knob{width:60px;height:34px;border-radius:20px;background:#8e9bc4;position:relative;flex:none}.knob::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tog.on .knob{background:#0a6b4c}.tog.on .knob::after{left:30px}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qb{padding:18px 8px;border-radius:20px;border:0;background:var(--g);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 20px var(--glow)}.qb small{display:block;font-weight:600;opacity:.85;font-size:12px;margin-top:2px}
.al{border-color:#ffb02066;background:#ffb02012}.alr{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}.alr:first-child{border-top:0}.alr i{font-style:normal;font-size:19px}
.pbar{height:10px;background:var(--card2);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--g);border-radius:9px}
.gear.sos{background:#ff5d73;color:#fff;border-color:#ff5d73;font-size:14px}
#lock{position:fixed;inset:0;z-index:100;background:var(--g);display:none;place-items:center;padding:20px}.lockbox{background:var(--card);border-radius:28px;padding:28px;width:min(320px,100%);text-align:center}.lockbox input{text-align:center;font-size:26px;letter-spacing:10px;margin-top:10px}
details summary{cursor:pointer;padding:8px 0}
.btn,input,select{min-height:50px}.chk input[type=checkbox]{width:22px;min-height:22px}
html[data-big="1"] body{zoom:1.18}
optgroup{font-style:normal}
.qb{position:relative}.qe{position:absolute;top:6px;right:10px;font-style:normal;opacity:.9;padding:2px 6px}
.mic{font-size:64px;text-align:center;animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.fab{position:fixed;right:16px;bottom:96px;width:60px;height:60px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:26px;box-shadow:0 10px 24px var(--glow);z-index:6}
#toast button{margin-left:12px;background:#ffffff30;color:inherit;border:0;border-radius:99px;padding:6px 12px;font-weight:800}
svg.map{color:var(--pc)}
</style>
</head>
<body>
<header><div class="logo">🛵</div><h1>रायडर <span>हिशोब</span><small id="hd"></small></h1><button class="gear sos" onclick="openSOS()" aria-label="SOS">🆘</button><button class="gear" onclick="cycleLang()" aria-label="language">🌐</button></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<button class="fab" id="fab" onclick="voiceQuick()" aria-label="voice order">🎤</button>
<div id="lock"><div class="lockbox"><div style="font-size:42px">🛵</div><h2>PIN टाका</h2><input id="lockPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()"><button class="btn" onclick="unlock()">उघडा</button><p class="mut" id="lockMsg"></p></div></div>

<script>
const R=["McDonald's","KFC","Domino's Pizza","Pizza Hut","Burger King","Subway","Starbucks","Haldiram's","Barbeque Nation","Behrouz Biryani","Faasos","Box8","Oven Story Pizza","La Pino'z Pizza","Wow! Momo","Wow! China","Chaayos","Chai Point","Theobroma","Baskin Robbins","Giani","Naturals Ice Cream","Mad Over Donuts","Dunkin'","Krispy Kreme","Burger Singh","Biryani By Kilo","Biryani Blues","Paradise Biryani","Mojo Pizza","Lunchbox","Freshmenu","Sagar Ratna","Saravana Bhavan","Goli Vada Pav","JumboKing","Kaati Zone","Rolls Mania","Taco Bell","Wendy's","Papa John's","Slice of Italy","Biryani Zone","Hotel Vaishali","Roopali","Goodluck Cafe","Chitale Bandhu","Kayani Bakery","Cafe Coffee Day","Barista","Third Wave Coffee","Blue Tokai","Bikanervala","Punjabi Tadka","Dhaba","Local Hotel","Bakery","Juice Centre","Chinese Corner","Mess / Tiffin","Pav Bhaji Centre","Misal House","Vada Pav Stall","Sweet Mart","Tea Stall"];
const K='rt_v2';
const DEF={duty:null,duties:[],orders:[],fuels:[],incs:[],slabs:[{n:10,a:100},{n:15,a:200},{n:20,a:350}],set:{},cash:0,rests:[],deposits:[],svc:{odo:0,every:3000},lastBackup:0,slabsBy:{},exps:[],rej:[],svcs:[],trk:[{"k": "oil", "n": "ऑइल चेंज", "every": 3000, "odo": 0}, {"k": "svc", "n": "फुल सर्व्हिसिंग", "every": 6000, "odo": 0}, {"k": "brake", "n": "ब्रेक पॅड", "every": 12000, "odo": 0}, {"k": "tyre", "n": "टायर", "every": 25000, "odo": 0}, {"k": "chain", "n": "चेन / बेल्ट", "every": 20000, "odo": 0}, {"k": "bat", "n": "बॅटरी", "every": 30000, "odo": 0}],docs:[{"name": "DL (लायसन्स)", "no": "", "exp": ""}, {"name": "RC", "no": "", "exp": ""}, {"name": "इन्शुरन्स", "no": "", "exp": ""}, {"name": "PUC", "no": "", "exp": ""}, {"name": "वॉरंटी", "no": "", "exp": ""}],chl:[],addrs:[],emis:[],fests:[],pre:{},pp:{},wt:0,cashBy:{Swiggy:0,Zomato:0,Zepto:0,BigBasket:0,Other:0},cashLog:[]};
const fresh=()=>JSON.parse(JSON.stringify(DEF));
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('साठवणूक भरली!')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const num=v=>parseFloat(v)||0;
const r1=n=>(Math.round(n*10)/10);
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b==null?Date.now():b).toDateString();
const hhmm=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
const dmy=t=>new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
const dur=ms=>{let s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const durH=ms=>{const m=Math.round(ms/60000);return Math.floor(m/60)+'h '+(m%60)+'m'};
const lIso=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function openModal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}

/* ---------- receipts in IndexedDB ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('rt',1);r.onupgradeneeded=()=>r.result.createObjectStore('r');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function rPut(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('r','readwrite');t.objectStore('r').put(v,String(k));t.oncomplete=()=>r()})}
async function rGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('r').objectStore('r').get(String(k));q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function rDel(k){const d=await idb();return new Promise(r=>{const t=d.transaction('r','readwrite');t.objectStore('r').delete(String(k));t.oncomplete=()=>r()})}
async function rAll(){const d=await idb();return new Promise(r=>{const o={};const q=d.transaction('r').objectStore('r').openCursor();q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else r(o)}})}
function shrink(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.src=u})}

/* ---------- GPS ---------- */
let wid=null,wake=null;
const hav=(a,b,c,d)=>{const t=x=>x*Math.PI/180,R=6371,dl=t(c-a),dn=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function startGPS(){
  if(!navigator.geolocation){toast('या फोनवर GPS नाही');return}
  if(wid!=null)return;
  wid=navigator.geolocation.watchPosition(p=>{
    const a=p.coords.latitude,b=p.coords.longitude,c=p.coords.accuracy;
    S.cur={a,b,t:Date.now()};
    if(!S.duty||c>60)return;
    const pts=S.duty.pts,l=pts[pts.length-1];
    if(!l)pts.push([a,b]);
    else{const d=hav(l[0],l[1],a,b);if(d>=0.02&&d<2){S.duty.gps+=d;pts.push([a,b]);if(pts.length>3000)pts.splice(1,1)}}
    save();if(tab==='duty')updLive();
  },e=>toast('GPS: '+(e.code===1?'परवानगी द्या (Location allow)':e.message)),{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
function stopGPS(){if(wid!=null)navigator.geolocation.clearWatch(wid);wid=null}
async function getWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.duty)getWake()});

/* ---------- stats ---------- */
function dutyStats(d,end){end=end||Date.now();
  const f=a=>a.filter(x=>x.ts>=d.t&&x.ts<=end+60000);
  const os=f(S.orders),is=f(S.incs),fs=f(S.fuels);
  return{orders:os.length,earn:os.reduce((s,o)=>s+o.earn,0),cod:os.reduce((s,o)=>s+(o.cod||0),0),inc:is.reduce((s,o)=>s+o.amt,0),fuel:fs.reduce((s,o)=>s+o.a,0)};
}
const todayOrders=()=>S.orders.filter(o=>sameDay(o.ts));
const avg=(arr,fn)=>{const v=arr.map(fn).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
function expectedInc(cnt){let a=0,n=0;[...S.slabs].sort((x,y)=>x.n-y.n).forEach(s=>{if(cnt>=s.n){a=s.a;n=s.n}});return{a,n}}
function calcMil(){const f=[...S.fuels].filter(x=>x.odo>0).sort((a,b)=>a.odo-b.odo);let km=0,l=0;for(let i=1;i<f.length;i++){const d=f[i].odo-f[i-1].odo;if(d>0&&f[i].l>0){km+=d;l+=f[i].l}}return l>0?km/l:0}
function incPerOrder(){const n=S.orders.length,t=S.incs.reduce((s,i)=>s+i.amt,0);return n&&t?t/n:0}

/* ---------- nav / render ---------- */
let tab='duty',sub='o',dPlat='all',dPer='7',showAll=false,manualT=false;
const TABS=[['duty','🏍','ड्युटी'],['ord','🧾','ऑर्डर'],['fuel','⛽','पेट्रोल'],['calc','🧮','कॅल्क'],['rep','📊','रिपोर्ट'],['dem','🔥','डिमांड']];
function render(){
  const hd=$('#hd');if(hd)hd.textContent=new Date().toLocaleDateString('mr-IN',{weekday:'long',day:'numeric',month:'short'});
  $('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';manualT=false;render();scrollTo(0,0)"><i>${t[1]}</i>${t[2]}</button>`).join('');
  $('#main').innerHTML=({duty:vDuty,ord:vOrders,fuel:vFuel,calc:vCalc,rep:vRep,dem:vDemand})[tab]();
  if(tab==='duty')updLive();
  if(tab==='fuel')loadThumbs();
  if(tab==='calc')calc();
}

/* ---------- DUTY ---------- */
function vDuty(){
  const d=S.duty;
  if(!d)return `<div class="card"><h2>ड्युटी सुरू करा</h2>
    <label>ओडोमीटर आत्ता (km)</label><input id="so" type="number" inputmode="decimal" value="${lastOdo()||''}" placeholder="उदा. 12450">

function pathSvg(p){
  if(p.length<2)return '<div class="mut">GPS ची वाट बघतोय… थोडे चालल्यावर रस्ता दिसेल.</div>';
  const w=320,h=170,pd=14,la=p.map(x=>x[0]),lo=p.map(x=>x[1]);
  const a0=Math.min(...la),a1=Math.max(...la),o0=Math.min(...lo),o1=Math.max(...lo),kx=Math.cos((a0+a1)/2*Math.PI/180);
  const sc=Math.min((w-2*pd)/(((o1-o0)*kx)||1e-6),(h-2*pd)/((a1-a0)||1e-6));
  const pt=x=>[(pd+(x[1]-o0)*kx*sc).toFixed(1),(h-pd-(x[0]-a0)*sc).toFixed(1)];
  const q=p.map(pt),e=q[q.length-1];
  return `<svg class="map" viewBox="0 0 ${w} ${h}"><polyline points="${q.map(x=>x.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${q[0][0]}" cy="${q[0][1]}" r="5" fill="#5cc8ff"/><circle cx="${e[0]}" cy="${e[1]}" r="7" fill="#ff6b57"/></svg>`;
}

function setv(k,v){if(k==='cash')cashAdd('Other',num(v)-cashTotal());else S.set[k]=v;save();calc()}
function calc(){
  const g=k=>num(S.set[k]),cash=S.cash||0,tg=g('target'),earn=g('earn'),km=g('km'),inc=g('inc'),pr=g('price'),mil=g('mil');
  const ppo=mil>0?km/mil*pr:0,net=earn+inc-ppo,rem=Math.max(0,tg-cash);
  const n=rem===0?0:(net>0?Math.ceil(rem/net):null);
  const tkm=n?n*km:0,lit=mil>0?tkm/mil:0,pc=lit*pr;
  const litCash=pr>0?cash/pr:0;
  const o=$('#out');if(!o)return;
  o.innerHTML=`
  <div class="w"><span>${rem===0&&tg?'टार्गेट कॅशने आधीच क्लिअर ✅':'क्लिअर करायला लागतील'}</span><b>${n===null?'—':n+' ऑर्डर'}</b></div>
  <div><b>${inr(rem)}</b><span>अजून बाकी (टार्गेट − कॅश)</span></div>
  <div><b>${inr(ppo)}</b><span>पेट्रोल खर्च / ऑर्डर</span></div>
  <div><b>${inr(net)}</b><span>निव्वळ / ऑर्डर (पेट्रोल वजा)</span></div>
  <div><b>${r1(lit)} लि</b><span>पेट्रोल लागेल (${n||0} ऑर्डरला)</span></div>
  <div><b>${inr(pc)}</b><span>त्या पेट्रोलचे पैसे</span></div>
  <div><b>${r1(tkm)} km</b><span>एकूण फिरावे लागेल</span></div>
  <div><b>${r1(litCash)} लि</b><span>हातातील कॅशचे पेट्रोल (${Math.round(litCash*mil)} km)</span></div>
  <div><b>${inr(earn+inc)}</b><span>कमाई + इन्सेंटिव्ह / ऑर्डर</span></div>
  ${net<=0&&rem>0?'<div class="w" style="background:#3a1712;border-color:#6b2a20"><b style="color:var(--red)">पेट्रोलच जास्त पडतेय!</b><span>कमाई कमी किंवा km जास्त — नफा होत नाही.</span></div>':''}`;
}

function vDemand(){
  const lim=dPer==='7'?Date.now()-7*864e5:0;
  const os=S.orders.filter(o=>o.ts>=lim&&(dPlat==='all'||o.pl===dPlat));

  const pl=grp(o=>o.pl);
  const gm={};os.filter(o=>o.lat!=null).forEach(o=>{const k=o.lat.toFixed(2)+','+o.lng.toFixed(2),g=gm[k]=gm[k]||{c:0,e:0,a:{}};g.c++;g.e+=o.earn;if(o.area)g.a[o.area]=(g.a[o.area]||0)+1});
  const hs=Object.entries(gm).map(([k,g])=>[(Object.entries(g.a).sort((a,b)=>b[1]-a[1])[0]||['📍 '+k])[0],g.c,g.e]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return seg+note+`<div class="card"><h3>एकूण ${os.length} ऑर्डर • सरासरी ${inr(os.reduce((s,o)=>s+o.earn,0)/os.length)}/ऑर्डर</h3>${bars(pl,x=>x[1]+' ऑर्डर')}</div>

  ${hs.length?`<div class="card"><h3>📍 GPS हॉटस्पॉट (~१ km क्षेत्र)</h3>${bars(hs,x=>x[1]+' • '+inr(x[2]/x[1]))}</div>`:''}
  <div class="card"><h3>कोणत्या वेळी जास्त</h3><div class="mut">सर्वात बिझी: <b style="color:var(--ac)">${top||'—'}</b></div>
  <div class="hours">${hrs.map(c=>`<div style="height:${c/mh*100}%"></div>`).join('')}</div><div class="hl">${hrs.map((c,h)=>`<span>${h%6===0?h:''}</span>`).join('')}</div></div>
  <div class="card"><h3>टॉप रेस्टॉरंट</h3>${bars(rs,x=>x[1]+' ऑर्डर')}</div>`;

function importBackup(f){

  r.onload=async()=>{let j;try{j=JSON.parse(String(r.result).replace(/^\uFEFF/,''))}catch(e){toast('ही JSON बॅकअप फाइल नाही');return}

    }catch(e){toast('Restore अयशस्वी: '+(e&&e.message?e.message:'फाइल चुकीची आहे'))}};

function importDS(j){
  if(!confirm('हा Delivery Saathi चा बॅकअप आहे. ऑर्डर आणि खर्च सध्याच्या डेटामध्ये जोडायचे? (आधीच आणलेले दोनदा येणार नाहीत)'))return;
  S.impIds=S.impIds||{};let nid=Date.now(),o=0,i=0,x=0,fu=0,skip=0;const mk=()=>++nid;

  const once=k=>{if(S.impIds[k])return false;S.impIds[k]=1;return true};
  (j.orders||[]).forEach(a=>{if(!a||!(+a.amount>=0))return;if(a.status==='pending'){skip++;return}const k='o'+(a.id||a.date+a.amount+(a.details||''));if(!once(k))return;const ts=tsOf(a.date,a.time),p=String(a.platform||'');
    if(/bonus|incentive/i.test(p)){S.incs.push({id:mk(),ts,pl:'Other',via:'',ty:'नियमित',amt:+a.amount,note:a.details||''});i++;return}
    S.orders.push({id:mk(),ts,rest:a.details||'(Delivery Saathi)',pl:['Swiggy','Zomato','Zepto','BigBasket'].includes(p)?p:'Other',via:p==='Shadowfax'?'Shadowfax':'',area:a.area||'',earn:+a.amount,km:0,cod:0,tip:0,tm:+a.tm||0});o++});
  const catMap={'Food':'जेवण','Repair':'पंक्चर / छोटी दुरुस्ती','Mobile Recharge':'मोबाईल रिचार्ज','Parking / Toll':'पार्किंग / टोल'},hasLog=Array.isArray(j.fuelLog)&&j.fuelLog.length;
  (j.expenses||[]).forEach(e=>{if(!e||!(+e.amount>0))return;const k='e'+(e.id||e.date+e.amount+(e.details||''));if(e.type==='Petrol / Fuel'&&hasLog&&/\sL\s·\s.*km/.test(e.details||''))return;if(!once(k))return;const ts=tsOf(e.date);
    if(e.type==='Petrol / Fuel'){S.fuels.push({id:mk(),ts,l:0,r:0,a:+e.amount,odo:0,cash:false,rc:false});fu++}else{S.exps.push({id:mk(),ts,cat:catMap[e.type]||'इतर',amt:+e.amount,note:e.details||'',cash:false});x++}});
  (j.fuelLog||[]).forEach(f=>{if(!f||!(+f.litres>0)||!(+f.amt>0))return;if(!once('f'+(f.id||f.date+f.odo)))return;S.fuels.push({id:mk(),ts:tsOf(f.date),l:+f.litres,r:Math.round(f.amt/f.litres*100)/100,a:+f.amt,odo:+f.odo||0,cash:false,rc:false});fu++});
  save();closeModal();render();toast(`आणले: ${o} ऑर्डर, ${i} इन्सेंटिव्ह, ${x} खर्च, ${fu} पेट्रोल${skip?' • '+skip+' प्रलंबित वगळले':''}`)}

const isoMs=s=>s?new Date(s+'T12:00:00').getTime():0;

const daysTo=iso=>Math.ceil((isoMs(iso)-Date.now())/864e5);
const FEST=[[1,1,'नववर्ष'],[1,14,'मकर संक्रांत'],[1,26,'प्रजासत्ताक दिन'],[2,14,'व्हॅलेंटाइन डे'],[5,1,'महाराष्ट्र दिन'],[8,15,'स्वातंत्र्य दिन'],[10,2,'गांधी जयंती'],[12,24,'ख्रिसमस ईव्ह'],[12,25,'ख्रिसमस'],[12,31,'न्यू इयर ईव्ह']];

const segH=(arr,cur,fn)=>`<div class="seg">${arr.map(x=>`<button class="${cur===x[0]?'on':''}" onclick="${fn}('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
const fld=(k,l,t,ph,extra)=>`<div><label>${l}</label><input type="${t||'number'}" ${t==='text'?'':'inputmode="decimal" step="any"'} value="${esc(S.set[k]===undefined?'':S.set[k])}" placeholder="${ph||''}" onchange="S.set['${k}']=${t==='text'?'this.value':'num(this.value)'};save();${extra||''}"></div>`;

/* slabs per company */
const slabsOf=c=>{S.slabsBy=S.slabsBy||{};return S.slabsBy[c]||S.slabs};
function expectedIncC(c,cnt){let a=0,n=0;[...slabsOf(c)].sort((x,y)=>x.n-y.n).forEach(s=>{if(cnt>=s.n){a=s.a;n=s.n}});return{a,n}}
const todayCo=c=>todayOrders().filter(o=>o.pl===c);
function slabMsg(c){const cnt=todayCo(c).length,nx=[...slabsOf(c)].sort((a,b)=>a.n-b.n).find(s=>s.n>cnt),cur=expectedIncC(c,cnt);return nx?`${c}: आणखी ${nx.n-cnt} ऑर्डर = +${inr(nx.a-cur.a)} जास्त (${inr(nx.a)})`:''}
function mutSlabs(fn){const a=JSON.parse(JSON.stringify(slabsOf(sCo))).sort((x,y)=>x.n-y.n);fn(a);S.slabsBy=S.slabsBy||{};S.slabsBy[sCo]=a;save();render()}
function setSlab(i,k,v){mutSlabs(a=>a[i][k]=num(v))}
function delSlab(i){mutSlabs(a=>a.splice(i,1))}
function addSlab(){mutSlabs(a=>a.push({n:a.length?a[a.length-1].n+5:10,a:100}))}

/* period calc (real profit) */
function per(lim,end){end=end||Infinity;const f=a=>a.filter(x=>x.ts>=lim&&x.ts<end),g=a=>a.map(x=>({...x,ts:isoMs(x.date)})).filter(x=>x.ts>=lim&&x.ts<end);
  const os=f(S.orders),is=f(S.incs),fs=f(S.fuels),es=f(S.exps),ss=g(S.svcs),ch=g(S.chl).filter(x=>x.paid);
  const earn=sum(os,'earn'),tip=sum(os,'tip'),inc=sum(is,'amt'),fuel=sum(fs,'a'),ex=sum(es,'amt'),sv=sum(ss,'cost'),fine=sum(ch,'amt');
  return{os,is,fs,es,ss,ch,earn,tip,inc,fuel,ex,sv,fine,gross:earn+tip+inc,net:earn+tip+inc-fuel-ex-sv-fine}}
const dutyHrs=(lim,end)=>{let h=S.duties.filter(d=>d.t>=lim&&(!end||d.t<end)).reduce((s,d)=>s+(d.end-d.t),0);if(S.duty&&S.duty.t>=lim&&(!end||S.duty.t<end))h+=Date.now()-S.duty.t;return h/36e5};
function dutyStats(d,end){end=end||Date.now();const f=a=>a.filter(x=>x.ts>=d.t&&x.ts<=end+60000),os=f(S.orders);return{orders:os.length,earn:sum(os,'earn'),tip:sum(os,'tip'),cod:sum(os,'cod'),inc:sum(f(S.incs),'amt'),fuel:sum(f(S.fuels),'a'),exp:sum(f(S.exps),'amt')}}
function payoutInfo(){const pd=S.set.payDay;if(pd===undefined||pd==='')return null;const lp=S.set.lastPayout||0,os=S.orders.filter(o=>o.via==='Shadowfax'&&o.ts>lp),is=S.incs.filter(o=>o.via==='Shadowfax'&&o.ts>lp);const t=new Date(),d=(+pd-t.getDay()+7)%7;return{pending:sum(os,'earn')+sum(os,'tip')+sum(is,'amt'),days:d,date:new Date(t.getFullYear(),t.getMonth(),t.getDate()+d)}}
function streakInfo(){const g=+S.set.ogoal||0;if(!g)return{st:0,g};const m={};S.orders.forEach(o=>{const k=dIso(o.ts);m[k]=(m[k]||0)+1});let st=0,d=new Date();if((m[dIso(d)]||0)<g)d.setDate(d.getDate()-1);while((m[dIso(d)]||0)>=g){st++;d.setDate(d.getDate()-1)}return{st,g}}
const badge=st=>st>=30?'🏆':st>=14?'🥇':st>=7?'🥈':st>=3?'🥉':'';

/* alerts */
function alertsHtml(){const a=[],t0=dayStart(Date.now()),yr=new Date().getFullYear();
  [...FEST.flatMap(f=>[yr,yr+1].map(y=>({n:f[2],d:new Date(y,f[0]-1,f[1]).getTime()}))),...S.fests.map(f=>({n:f.name,d:dayStart(isoMs(f.date))}))].forEach(f=>{const k=Math.round((f.d-t0)/864e5);if(k>=0&&k<=2)a.push(['🎉',`${k===0?'आज':k===1?'उद्या':'परवा'}: ${esc(f.n)} — डिमांड जास्त असू शकते`])});
  S.emis.forEach(e=>{const d=new Date(new Date().getFullYear(),new Date().getMonth(),e.day);if(d.getTime()<t0)d.setMonth(d.getMonth()+1);const k=Math.round((d-t0)/864e5);if(k<=3)a.push(['💳',`${esc(e.name)} हप्ता ${inr(e.amt)} — ${k===0?'आज':k+' दिवसात'}`])});
  S.docs.forEach(d=>{if(!d.exp)return;const k=daysTo(d.exp);if(k<=30)a.push(['📄',`${esc(d.name)} ${k<0?'एक्स्पायर झाले ('+(-k)+' दिवस)':'रिन्यूअल '+k+' दिवसात'}`])});
  const lo=lastOdo();S.trk.forEach(t=>{if(!t.odo)return;const rem=t.odo+t.every-lo;if(rem<=Math.max(200,t.every*.1))a.push(['🔧',`${esc(t.n)}: ${rem<=0?'ओव्हरड्यू '+Math.abs(Math.round(rem))+' km':Math.round(rem)+' km बाकी'}`])});
  const unp=S.chl.filter(c=>!c.paid);if(unp.length)a.push(['🚨',`${unp.length} चलन बाकी • ${inr(sum(unp,'amt'))}`]);
  if((S.orders.length||S.fuels.length)&&Date.now()-(S.lastBackup||0)>7*864e5)a.push(['💾','बॅकअप घेऊन ७ दिवस झाले — सेटिंगमध्ये बॅकअप घ्या']);
  CASHCO.forEach(c=>{const lim=+S.set['lim_'+c]||0,fl=(S.cashBy||{})[c]||0;if(lim&&fl>=lim*.8)a.push(['💰',`${c} फ्लोटिंग कॅश ${inr(fl)} / ${inr(lim)} — डिपॉझिट करा`])});const pp=payoutInfo();if(pp&&pp.pending>0&&pp.days<=1)a.push(['💸',`Shadowfax पेआउट ${pp.days===0?'आज':'उद्या'} • बाकी ${inr(pp.pending)}`]);
  return a.length?`<div class="card al">${a.map(x=>`<div class="alr"><i>${x[0]}</i><span>${x[1]}</span></div>`).join('')}</div>`:''}

/* goals / compare */
function goalsCard(){const si=streakInfo(),t=new Date(),wk=dayStart(Date.now()-((t.getDay()+6)%7)*864e5),mo=new Date(t.getFullYear(),t.getMonth(),1).getTime(),pw=S.orders.filter(o=>o.ts>=wk).length,pm=per(mo),wg=+S.set.wgoal||0,sv=+S.set.save||0;
  const bar=(l,v,g,f)=>`<div style="margin:10px 0"><div class="row"><span>${l}</span><b>${f(v)} / ${f(g)}</b></div><div class="pbar"><i style="width:${Math.min(100,g?v/g*100:0)}%"></i></div></div>`;
  return `<div class="card"><h3>🎯 लक्ष्य आणि स्ट्रीक</h3>${si.g?`<div class="row"><span>सलग दिवस (रोज ${si.g}+ ऑर्डर)</span><b style="font-size:22px">${badge(si.st)} ${si.st}</b></div>`:'<p class="mut">सेटिंगमध्ये रोजचे ऑर्डर टार्गेट टाका.</p>'}${wg?bar('या आठवड्याच्या ऑर्डर',pw,wg,x=>x):''}${sv?bar('महिन्याची बचत (निव्वळ)',Math.max(0,pm.net),sv,inr):''}</div>`}
function cmpCard(){const t0=dayStart(Date.now()),y0=t0-864e5,w0=t0-7*864e5,A=per(t0),B=per(y0,t0),C=per(w0,w0+864e5);
  const row=(l,p,h)=>`<div class="item"><div class="m"><div class="t">${l}</div><div class="s">${p.os.length} ऑर्डर • ${r1(h)} तास</div></div><div class="v">${inr(p.gross)}</div></div>`;
  const d1=A.gross-B.gross,d2=A.gross-C.gross;
  return `<div class="card"><h3>📈 आज विरुद्ध काल / गेल्या आठवड्याचा तोच दिवस</h3>${row('आज',A,dutyHrs(t0))}${row('काल',B,dutyHrs(y0,t0))}${row('गेल्या आठवड्याचा तोच वार',C,dutyHrs(w0,w0+864e5))}<p class="mut">कालपेक्षा <b style="color:${d1>=0?'var(--ac)':'var(--red)'}">${d1>=0?'+':'−'}${inr(Math.abs(d1))}</b> • गेल्या आठवड्यापेक्षा <b style="color:${d2>=0?'var(--ac)':'var(--red)'}">${d2>=0?'+':'−'}${inr(Math.abs(d2))}</b></p></div>`}

/* ================= DUTY ================= */
function svcCard(){return ''}
function cashCard(){const o=todayOrders(),cod=sum(o,'cod'),dep=sum(S.deposits.filter(x=>sameDay(x.ts)),'amt');return `<div class="card"><h3>💰 कॅश (COD) आणि टार्गेट</h3><div class="two"><div><label>हातात कॅश ₹</label><input type="number" inputmode="decimal" value="${S.cash||''}" onchange="S.cash=num(this.value);save();toast('कॅश अपडेट')"></div><div><label>आजचे टार्गेट ₹</label><input type="number" inputmode="decimal" value="${S.set.goal||''}" placeholder="1500" onchange="S.set.goal=num(this.value);save();updLive()"></div></div><p class="mut">आज COD गोळा ${inr(cod)} • जमा केले ${inr(dep)} • कंपनीला द्यायचे (हातात) <b>${inr(S.cash||0)}</b></p><button class="btn ghost" onclick="depositCash()">⬇ कॅश जमा केली (डिपॉझिट)</button>${S.deposits.slice(0,3).map(x=>`<div class="item"><div class="m"><div class="t">जमा</div><div class="s">${dmy(x.ts)} ${hhmm(x.ts)}</div></div><div class="v">${inr(x.amt)}</div></div>`).join('')}</div>`}
const qAmt=c=>{const v=S.set['q_'+c];if(v)return +v;return Math.round(avg(S.orders.filter(o=>o.pl===c),x=>x.earn))||0};
function quickCard(){return `<div class="card"><h3>⚡ वन-टॅप ऑर्डर</h3><div class="chk" style="margin-bottom:8px"><input type="checkbox" ${S.set.viaSf?'checked':''} onchange="S.set.viaSf=this.checked;save()"> Shadowfax मार्फत</div><div class="qg">${COS.slice(0,4).map(c=>`<button class="qb" onclick="quickAdd('${c}')">${c}<small>${inr(qAmt(c))}</small></button>`).join('')}</div><div class="two"><button class="btn ghost" onclick="voiceQuick()">🎤 बोलून ऑर्डर</button><button class="btn ghost" onclick="undoLast()">↩ शेवटची Undo</button></div></div>`}
function quickAdd(c,amt,rest){const cur=S.cur&&Date.now()-S.cur.t<600000?S.cur:null;S.orders.push({id:Date.now(),ts:Date.now(),rest:rest||'Quick',pl:c,via:S.set.viaSf?'Shadowfax':'',area:'',earn:amt!=null?amt:qAmt(c),km:0,cod:0,tip:0,lat:cur?cur.a:null,lng:cur?cur.b:null});save();render();toast(c+' ऑर्डर नोंदवली ✔ '+slabMsg(c));if(navigator.vibrate)navigator.vibrate(40)}
function undoLast(){const o=S.orders.slice().sort((a,b)=>b.id-a.id)[0];if(!o){toast('ऑर्डर नाही');return}if(o.cod)cashAdd(o.pl,-o.cod);S.orders=S.orders.filter(x=>x.id!==o.id);save();render();toast('Undo: '+o.rest+' '+inr(o.earn))}
function voiceQuick(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('या ब्राउझरमध्ये आवाज सुविधा नाही.');return}const r=new SR();r.lang={mr:'mr-IN',hi:'hi-IN',en:'en-IN'}[S.set.lang||'mr'];r.interimResults=false;toast('ऐकत आहे… बोला');
  r.onresult=ev=>{let t=ev.results[0][0].transcript.replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c)),l=t.toLowerCase(),m=t.match(/\d+(\.\d+)?/);const c=/swiggy|स्विगी/.test(l)?'Swiggy':/zomato|झोमॅटो|झोमाटो/.test(l)?'Zomato':/zepto|झेप्टो/.test(l)?'Zepto':/big ?basket|बिगबास्केट|बिग बास्केट/.test(l)?'BigBasket':null;if(!c||!m){toast('"Swiggy 60" असे बोला');return}quickAdd(c,+m[0],t.replace(m[0],'').replace(/swiggy|zomato|zepto|big ?basket|स्विगी|झोमॅटो|झोमाटो|झेप्टो|बिगबास्केट/ig,'').trim()||'Voice')};
  r.onerror=()=>toast('आवाज ओळखता आला नाही.');r.start()}
function vDuty(){const d=S.duty,tog=`<div class="tog ${d?'on':''}" onclick="${d?'askEnd()':'askStart()'}"><div class="knob"></div><div><b>${d?'ON DUTY':'OFF DUTY'}</b><span>${d?'ड्युटी संपवण्यासाठी टॅप करा':'ड्युटी सुरू करण्यासाठी टॅप करा'}</span></div></div>`;
  if(!d){const A=per(dayStart(Date.now()));return tog+alertsHtml()+quickCard()+`<div class="card"><h3>आजचा सारांश</h3><div class="out"><div><b>${A.os.length}</b><span>ऑर्डर</span></div><div><b>${inr(A.gross)}</b><span>कमाई (इन्सेंटिव्ह+टिप सहित)</span></div><div><b>${inr(A.fuel+A.ex)}</b><span>पेट्रोल + इतर खर्च</span></div><div><b>${inr(A.net)}</b><span>टेक-होम</span></div></div></div>`+cmpCard()+goalsCard()+histHtml()}
  return tog+`<div class="card hero"><div class="mut">ड्युटी चालू • सुरू ${hhmm(d.t)} • ओडो ${d.odo}</div><div class="row"><div class="big" id="tm">00:00:00</div><div class="ring" id="rg"><b id="rgp">—</b></div></div><div class="grid3"><div><b id="gk">0</b><span>GPS km</span></div><div><b id="oc">0</b><span>ऑर्डर</span></div><div><b id="ea">₹0</b><span>कमाई</span></div></div><div class="grid3"><div><b id="ph">₹0</b><span>₹ / तास</span></div><div><b id="pk">₹0</b><span>₹ / km</span></div><div><b id="nf">₹0</b><span>टेक-होम</span></div></div><p class="mut" id="lf" style="margin:10px 0 0"></p><div id="gpsS" style="margin-top:8px;font-size:13px"></div></div><div id="lv"></div>`+quickCard()+`<div class="card"><h3>GPS रस्ता (progress)</h3><div id="map"></div></div>`+cashCard()+`<button class="btn ghost" onclick="bs='c';tab='bike';render()">✅ ड्युटीपूर्व चेकलिस्ट ${S.pre[dIso(Date.now())]?'(आज पूर्ण ✔)':''}</button>`}
function askStart(){openModal(`<h2>ड्युटी सुरू करा</h2><label>ओडोमीटर आत्ता (km)</label><input id="so" type="number" inputmode="decimal" value="${lastOdo()||''}"><label>हातात कॅश (₹)</label><input id="sc" type="number" inputmode="decimal" value="${S.cash||''}"><button class="btn big" onclick="startDuty()">▶ Start Duty</button><button class="btn ghost" onclick="closeModal()">रद्द</button>`)}
function startDuty(){const odo=num($('#so').value);if(!odo){toast('ओडोमीटर टाका');return}cashAdd('Other',num($('#sc').value)-cashTotal());S.duty={id:Date.now(),t:Date.now(),odo,gps:0,pts:[],cash0:S.cash,br:Date.now()};save();closeModal();startGPS();getWake();render();toast('ड्युटी सुरू — GPS चालू')}
function askEnd(){const d=S.duty;openModal(`<h2>ड्युटी संपवा</h2><label>ओडोमीटर शेवटचे (km)</label><input id="eo" type="number" inputmode="decimal" placeholder="उदा. ${d.odo+80}"><button class="btn red big" onclick="endDuty()">■ End Duty</button><button class="btn ghost" onclick="closeModal()">रद्द</button>`)}

  const rec={id:d.id,t:d.t,end,odo:d.odo,odoEnd:eo,odoKm:eo-d.odo,gps:d.gps,orders:st.orders,earn:st.earn,tip:st.tip,inc:st.inc,fuel:st.fuel,exp:st.exp,net,cash0:d.cash0,cash1:S.cash};

function histHtml(){if(!S.duties.length)return '';return `<div class="card"><h3>मागच्या ड्युट्या</h3>`+S.duties.slice(0,7).map(d=>`<div class="item"><div class="m"><div class="t">${dmy(d.t)} • ${durH(d.end-d.t)}</div><div class="s">${d.odoKm} km (ओडो) • GPS ${r1(d.gps)} km • ${d.orders} ऑर्डर${d.end>d.t?' • ₹'+Math.round(d.net/((d.end-d.t)/36e5))+'/तास':''}</div></div><div class="v">${inr(d.net)}</div></div>`).join('')+`<p class="mut">उजवीकडे = टेक-होम (कमाई + टिप + इन्सेंटिव्ह − पेट्रोल − इतर खर्च)</p></div>`}
function updLive(){const d=S.duty;if(!d||tab!=='duty')return;const st=dutyStats(d),t=$('#tm');if(!t)return;t.textContent=dur(Date.now()-d.t);$('#gk').textContent=r1(d.gps);$('#oc').textContent=st.orders;$('#ea').textContent=inr(st.earn);

function trkCard(){const lo=lastOdo();return `<div class="card"><h2>🔧 रिमाइंडर आणि पार्ट्स लाइफ (km)</h2><p class="mut">सध्याचे ओडो: <b>${lo||'—'}</b>. "बदलले" दाबल्यावर आत्ताचे ओडो नोंदवले जाते.</p>${S.trk.map((t,i)=>{const rem=t.odo?t.odo+t.every-lo:null,pc=t.odo?Math.min(100,Math.max(0,(lo-t.odo)/t.every*100)):0,col=rem===null?'var(--mut)':rem<=0?'var(--red)':rem<=Math.max(200,t.every*.1)?'#ffb020':'var(--ac)';return `<div style="margin:14px 0"><div class="row"><b>${esc(t.n)}</b><span style="color:${col};font-weight:700">${rem===null?'ओडो नोंदवा':rem<=0?'ओव्हरड्यू '+Math.abs(Math.round(rem))+' km':Math.round(rem)+' km बाकी'}</span></div><div class="pbar"><i style="width:${pc}%;background:${col}"></i></div><div class="two" style="margin-top:6px"><input type="number" inputmode="decimal" placeholder="शेवटचे ओडो" value="${t.odo||''}" onchange="S.trk[${i}].odo=num(this.value);save();render()"><input type="number" inputmode="decimal" placeholder="दर किती km" value="${t.every}" onchange="S.trk[${i}].every=num(this.value)||1;save();render()"></div><button class="btn ghost sm" style="margin-top:6px" onclick="S.trk[${i}].odo=lastOdo();save();render();toast('नोंदवले')">✔ आत्ता बदलले (ओडो ${lo||'—'})</button></div>`}).join('')}<p class="mut">डीफॉल्ट km अंदाजे आहेत — तुमच्या बाईकच्या मॅन्युअलनुसार बदला.</p></div>`}
function bMain(){const ss=S.svcs.slice().sort((a,b)=>b.date.localeCompare(a.date)),yr=String(new Date().getFullYear());
  return trkCard()+`<div class="card"><h2>सर्व्हिस नोंद जोडा</h2><div class="two"><div><label>तारीख</label><input id="vd" type="date" value="${dIso(Date.now())}"></div><div><label>ओडो (km)</label><input id="vo" type="number" inputmode="decimal" value="${lastOdo()||''}"></div></div><label>काम काय केले</label><input id="vw" placeholder="उदा. ऑइल चेंज, ब्रेक पॅड"><div class="two"><div><label>खर्च ₹</label><input id="vc" type="number" inputmode="decimal"></div><div><label>रेटिंग (१-५ ⭐)</label><select id="vr">${[5,4,3,2,1].map(x=>`<option>${x}</option>`).join('')}</select></div></div>
  <label>गॅरेजचे नाव</label><input id="vg" list="gl" placeholder="गॅरेज"><datalist id="gl">${[...new Set(S.svcs.map(x=>x.garage).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="two"><div><label>मेकॅनिकचे नाव</label><input id="vm"></div><div><label>फोन नंबर</label><input id="vp" type="tel" inputmode="tel"></div></div><label>पत्ता</label><input id="va"><p class="mut" id="gs">📍 GPS लोकेशन घेत आहे…</p><button class="btn ghost" onclick="capGps()">📍 लोकेशन पुन्हा घ्या</button>
  <label>अनुभव / नोट</label><input id="vn" placeholder="ऐच्छिक"><label>बिलाचा फोटो (मेकॅनिकची पावती)</label><input id="vf" type="file" accept="image/*" capture="environment"><button class="btn" onclick="addSvc()">+ सेव्ह</button></div>
  <div class="card"><h3>सर्व्हिस इतिहास • या वर्षी ${inr(sum(S.svcs.filter(x=>x.date.startsWith(yr)),'cost'))} • एकूण ${inr(sum(S.svcs,'cost'))}</h3>${ss.length?ss.map(x=>`<div class="item">${x.rc?`<img class="thumb" id="bl${x.id}" onclick="viewImg('sv${x.id}')" alt="">`:''}<div class="m"><div class="t">${esc(x.work||'सर्व्हिस')} ${x.rate?'⭐'.repeat(x.rate):''}</div><div class="s">${x.date} • ${x.odo||'—'} km • ${esc(x.garage||'')}${x.mech?' • '+esc(x.mech):''}${x.phone?` • <a style="color:var(--blue)" href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:''}${x.lat!=null?` • <a style="color:var(--blue)" href="https://maps.google.com/?q=${x.lat},${x.lng}" target="_blank">📍</a>`:''}</div></div><div class="v">${inr(x.cost)}</div><button class="x" onclick="delSvc(${x.id})">✕</button></div>`).join(''):'<p class="mut">अजून नोंद नाही.</p>'}<p class="mut">सर्व्हिसिंगचा खर्च रिपोर्टमध्ये नफ्यातून वजा होतो.</p></div>`}
function capGps(){if(!navigator.geolocation){return}navigator.geolocation.getCurrentPosition(p=>{window._sg={a:p.coords.latitude,b:p.coords.longitude};const s=$('#gs');if(s)s.textContent='📍 लोकेशन मिळाले ✅ ('+p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4)+')'},()=>{const s=$('#gs');if(s)s.textContent='⚠ लोकेशन मिळाले नाही — परवानगी द्या'},{enableHighAccuracy:true,timeout:10000})}
async function addSvc(){const cost=num($('#vc').value);if(!$('#vw').value.trim()&&!cost){toast('काम किंवा खर्च टाका');return}const id=Date.now(),f=$('#vf').files[0];if(f){try{await rPut('sv'+id,await shrink(f))}catch(e){toast('फोटो साठवता आला नाही')}}
  const g=window._sg||(S.cur&&Date.now()-S.cur.t<600000?{a:S.cur.a,b:S.cur.b}:null);S.svcs.push({id,date:$('#vd').value||dIso(Date.now()),odo:num($('#vo').value),work:$('#vw').value.trim(),cost,rate:+$('#vr').value,garage:$('#vg').value.trim(),mech:$('#vm').value.trim(),phone:$('#vp').value.trim(),addr:$('#va').value.trim(),lat:g?g.a:null,lng:g?g.b:null,note:$('#vn').value.trim(),rc:!!f});window._sg=null;save();render();toast('सर्व्हिस सेव्ह')}
function delSvc(id){const x=S.svcs.find(s=>s.id===id);if(!x||!confirm('ही नोंद डिलीट करायची?'))return;if(x.rc)rDel('sv'+id);S.svcs=S.svcs.filter(s=>s.id!==id);save();render()}
function viewImg(k){rGet(k).then(s=>s&&openModal(`<img src="${s}" alt=""><button class="btn ghost" onclick="closeModal()">बंद करा</button>`))}
function loadBills(){S.svcs.filter(x=>x.rc).forEach(x=>rGet('sv'+x.id).then(s=>{const e=$('#bl'+x.id);if(e&&s)e.src=s}))}
function garMap(pts){if(!pts.length)return '<p class="mut">लोकेशनसह गॅरेज नोंद नाही.</p>';const w=320,h=200,pd=24,la=pts.map(p=>p.a),lo=pts.map(p=>p.b),a0=Math.min(...la),a1=Math.max(...la),o0=Math.min(...lo),o1=Math.max(...lo),kx=Math.cos((a0+a1)/2*Math.PI/180),sc=Math.min((w-2*pd)/(((o1-o0)*kx)||1e-4),(h-2*pd)/((a1-a0)||1e-4)),pt=p=>[pd+(p.b-o0)*kx*sc+((w-2*pd)-(o1-o0)*kx*sc)/2,h-pd-(p.a-a0)*sc-((h-2*pd)-(a1-a0)*sc)/2];
  return `<svg class="map" viewBox="0 0 ${w} ${h}" style="height:200px">${pts.map(p=>{const q=pt(p);return p.me?`<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="#5cc8ff"/><text x="${q[0]+10}" y="${q[1]+4}" font-size="11" fill="currentColor">मी</text>`:`<circle cx="${q[0]}" cy="${q[1]}" r="10" fill="#ff5d73"/><text x="${q[0]}" y="${q[1]+4}" font-size="11" fill="#fff" text-anchor="middle">${p.i}</text>`}).join('')}</svg>`}
function bGar(){const g={};S.svcs.forEach(x=>{const k=(x.garage||'—').trim(),b=g[k]=g[k]||{n:0,c:0,r:0,rn:0,x:null};b.n++;b.c+=x.cost;if(x.rate){b.r+=x.rate;b.rn++}if(x.lat!=null)b.x=x;if(x.phone)b.ph=x.phone;if(x.addr)b.ad=x.addr;if(x.mech)b.me=x.mech});
  const list=Object.entries(g).sort((a,b)=>(b[1].rn?b[1].r/b[1].rn:0)-(a[1].rn?a[1].r/a[1].rn:0)),pts=[];list.forEach(([k,b],i)=>{if(b.x)pts.push({a:b.x.lat,b:b.x.lng,i:i+1})});if(S.cur)pts.push({a:S.cur.a,b:S.cur.b,me:1});
  return `<div class="card"><h2>🏪 माझे गॅरेज (नकाशा)</h2>${garMap(pts)}<p class="mut">लाल = गॅरेज (क्रमांक यादीप्रमाणे), निळा = मी. गॅरेज जोडताना GPS लोकेशन आपोआप सेव्ह होते.</p></div><div class="card"><h3>गॅरेज रेटिंग आणि खर्च</h3>${list.length?list.map(([k,b],i)=>{const d=b.x&&S.cur?hav(S.cur.a,S.cur.b,b.x.lat,b.x.lng):null;return `<div class="item"><div class="m"><div class="t">${i+1}. ${esc(k)} ${b.rn?'⭐'+r1(b.r/b.rn):''}</div><div class="s">${b.n} भेटी • सरासरी ${inr(b.c/b.n)}${b.me?' • '+esc(b.me):''}${b.ph?` • <a style="color:var(--blue)" href="tel:${esc(b.ph)}">${esc(b.ph)}</a>`:''}${b.ad?' • '+esc(b.ad):''}${d!=null?' • '+r1(d)+' km दूर':''}</div>${b.x?`<div class="s"><a style="color:var(--blue)" href="https://maps.google.com/?q=${b.x.lat},${b.x.lng}" target="_blank">📍 नकाशा</a> • <a style="color:var(--blue)" href="https://www.google.com/maps/dir/?api=1&destination=${b.x.lat},${b.x.lng}" target="_blank">🧭 रस्ता</a></div>`:''}</div></div>`}).join(''):'<p class="mut">"सर्व्हिस" टॅबमध्ये सर्व्हिस नोंदवा — गॅरेज इथे दिसेल.</p>'}</div>`}
function bParts(){const m=S.set.model||'Suzuki Access 125',cat=m==='__c'?(S.set.ccat||'sc'):catOfModel(m),P=PARTS[cat],sel=window._sel=window._sel||{},fac=num(S.set.mult)||1.25;let lo=0,hi=0,me=0;P.forEach((p,i)=>{if(sel[i]){lo+=p[1];hi+=p[2];me+=ppOf(m,p)}});

const sdb=()=>new Promise((res,rej)=>{const r=indexedDB.open('rt_snap',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function snapPut(){try{const d=await sdb(),ts=Date.now();await new Promise(r=>{const t=d.transaction('s','readwrite'),st=t.objectStore('s');st.put({ts,n:S.orders.length,x:S.exps.length,json:JSON.stringify(S)},String(ts));const q=st.getAllKeys();q.onsuccess=()=>{const ks=q.result.sort();while(ks.length>10)st.delete(ks.shift())};t.oncomplete=r;t.onerror=r})}catch(e){}}
function autoSnap(){if(Date.now()-(S.set.lastSnap||0)>3*3600e3&&(S.orders.length||S.exps.length||S.fuels.length)){S.set.lastSnap=Date.now();save();snapPut()}}
async function snapList(){try{const d=await sdb();return await new Promise(r=>{const q=d.transaction('s').objectStore('s').getAll();q.onsuccess=()=>r((q.result||[]).sort((a,b)=>b.ts-a.ts));q.onerror=()=>r([])})}catch(e){return[]}}
async function snapRestore(ts){const d=await sdb(),v=await new Promise(r=>{const q=d.transaction('s').objectStore('s').get(String(ts));q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(!v||!confirm('या स्नॅपशॉटवर परत जायचे? सध्याचा डेटा बदलेल.'))return;S=Object.assign(fresh(),JSON.parse(v.json));ensureCash();save();render();toast('Restore पूर्ण')}
async function fillSnaps(){const el=$('#snapL');if(!el)return;const l=await snapList();el.innerHTML=l.length?l.map(x=>`<div class="item"><div class="m"><div class="t">${dmy(x.ts)} ${hhmm(x.ts)}</div><div class="s">${x.n} orders • ${x.x} exp</div></div><button class="btn sm" onclick="snapRestore(${x.ts})">Restore</button></div>`).join(''):'<p class="mut">अजून स्नॅपशॉट नाही.</p>';applyLang()}
const bkSig=()=>[S.orders.length,S.exps.length,S.fuels.length,S.incs.length,S.svcs.length,Math.round(S.cash)].join('|');
async function silentDl(){const f=await backupFile(),a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

const DK=DICT_RAW.trim().split('\n').map(l=>l.split('|')).filter(x=>x.length>=2&&x[0]).sort((a,b)=>b[0].length-a[0].length);
function tx(s){const l=S.set&&S.set.lang||'mr';if(l==='mr'||typeof s!=='string')return s;const i=l==='en'?1:2;let o=s;DK.forEach(k=>{if(o.includes(k[0])){const r=k[i]||(i===2?null:k[1]);if(r!==null&&r!==undefined)o=o.split(k[0]).join(r)}});return o}
function applyLang(){const l=S.set.lang||'mr';document.documentElement.lang=l;document.documentElement.dataset.ac=S.set.ac||'orange';document.documentElement.dataset.big=S.set.big?1:0;if(l==='mr')return;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),todo=[];let n;while(n=w.nextNode()){if(n.parentElement.closest('script,style,textarea'))continue;if(/[\u0900-\u097F]/.test(n.nodeValue))todo.push(n)}todo.forEach(n=>n.nodeValue=tx(n.nodeValue));
  document.querySelectorAll('[placeholder]').forEach(e=>{if(/[\u0900-\u097F]/.test(e.placeholder))e.placeholder=tx(e.placeholder)})}
